name: Enterprise Platform CI/CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: 🛡️ Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Database Client
        run: npx prisma generate --schema=enterprise-platform/packages/database/prisma/schema.prisma

      - name: Run Workspace Type Check & Verification
        run: npm run build

  docker-build:
    name: 🐳 Docker Container Build & Security Scan
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build NestJS API Container
        uses: docker/build-push-action@v5
        with:
          context: ./enterprise-platform
          file: ./enterprise-platform/Dockerfile.api
          push: false
          tags: srirama/api:latest

      - name: Build Next.js Web Container
        uses: docker/build-push-action@v5
        with:
          context: ./enterprise-platform
          file: ./enterprise-platform/Dockerfile.web
          push: false
          tags: srirama/web:latest

      - name: Build Next.js Admin Container
        uses: docker/build-push-action@v5
        with:
          context: ./enterprise-platform
          file: ./enterprise-platform/Dockerfile.admin
          push: false
          tags: srirama/admin:latest

  deploy-gh-pages:
    name: 🚀 Zero-Downtime Live GitHub Pages Deploy
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Live Web App
        run: |
          npm ci
          npm run build

      - name: Deploy Dist to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
